<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower</title>
<style>
:root{--bg:#06110c;--fg:#d3ead9;--dim:#5d7a66;--bad:#ff6b5e;--acc:#7ee0a8;--chip:#10241a;--chipon:#1f4a32}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px ui-monospace,Menlo,monospace;overflow:hidden}
body{display:flex;flex-direction:column}
#bar{display:flex;gap:28px;padding:8px 16px;color:var(--dim)} #bar b{color:var(--fg);font-weight:600}
#view{flex:1;position:relative;min-height:0} canvas{position:absolute;inset:0;width:100%;height:100%}
#over{position:absolute;inset:0;display:none;place-items:center;font-size:30px;background:rgba(0,0,0,.55);text-align:center;line-height:1.6}
#term{padding:6px 16px 14px;position:relative}
#out{min-height:1.3em;color:var(--dim)} #out.bad{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center} .row span{color:var(--acc);font-size:20px}
#cmd{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:22px;caret-color:var(--acc)}
#sug{position:absolute;bottom:100%;left:16px;display:flex;gap:6px;flex-wrap:wrap}
#sug i{font-style:normal;padding:2px 9px;border-radius:4px;background:var(--chip);color:var(--dim)} #sug i.on{background:var(--chipon);color:var(--fg)}
</style></head><body>
<div id="bar"><span>score <b id="score">0</b></span><span>strikes <b id="strikes"></b></span><span>best <b id="best">0</b></span><span>ready <span id="ready"></span></span></div>
<div id="view"><canvas id="cv"></canvas><div id="over"></div></div>
<div id="term"><div id="sug"></div><div id="out">heron west · heron low · heron land · wren takeoff · wren to maple · wren high</div>
<div class="row"><span>›</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div></div>
<script>
/* ---------- terminal: words only, every word autocompletes, a unique prefix is enough ---------- */
const cmd=document.getElementById('cmd'),sugEl=document.getElementById('sug'),outEl=document.getElementById('out');
const T={hist:[],hi:0,sel:0,cands:[]};
function say(s){const bad=s.startsWith('!');outEl.textContent=bad?s.slice(1):s;outEl.className=bad?'bad':''}
function resolve(toks){const out=[];for(const w of toks){const opts=options(out);if(opts.includes(w)){out.push(w);continue}
  const m=opts.filter(o=>o.startsWith(w));if(m.length===1){out.push(m[0]);continue}
  return{err:m.length?`!${w}: ${m.slice(0,6).join(' / ')}?`:`!${w}?`}}return{words:out}}
function parts(){const t=cmd.value.toLowerCase().split(/\s+/);return{done:t.slice(0,-1).filter(Boolean),part:t[t.length-1]}}
function refreshSug(){const{done,part}=parts();const r=resolve(done);
  T.cands=(r.err||!cmd.value.trim())?[]:options(r.words).filter(o=>o.startsWith(part));
  if(T.sel>=T.cands.length)T.sel=0;
  sugEl.innerHTML=T.cands.slice(0,10).map((c,i)=>`<i class="${i===T.sel?'on':''}">${c}</i>`).join('')}
function typedHead(){const w=cmd.value.toLowerCase().trim().split(/\s+/)[0];if(!w)return null;const o=options([]);
  if(o.includes(w))return w;const m=o.filter(x=>x.startsWith(w));return m.length===1?m[0]:null}
cmd.addEventListener('input',()=>{T.sel=0;refreshSug()});
cmd.addEventListener('keydown',e=>{
  const atEnd=cmd.selectionStart===cmd.value.length;
  if((e.key==='Tab'||(e.key==='ArrowRight'&&atEnd))&&T.cands.length){e.preventDefault();
    const{done,part}=parts();cmd.value=cmd.value.slice(0,cmd.value.length-part.length)+T.cands[T.sel]+' ';T.sel=0;refreshSug();return}
  if(e.key==='Tab'){e.preventDefault();return}
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&T.cands.length>1&&parts().part){e.preventDefault();
    T.sel=(T.sel+(e.key==='ArrowDown'?1:T.cands.length-1))%T.cands.length;refreshSug();return}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();if(!T.hist.length)return;
    T.hi=Math.max(0,Math.min(T.hist.length,T.hi+(e.key==='ArrowUp'?-1:1)));cmd.value=T.hist[T.hi]||'';refreshSug();return}
  if(e.key==='Escape'){e.preventDefault();if(cmd.value)cmd.value='';else togglePause();refreshSug();return}
  if(e.key==='Enter'){e.preventDefault();const v=cmd.value.trim().toLowerCase();if(!v)return;
    T.hist.push(v);T.hi=T.hist.length;cmd.value='';refreshSug();
    const r=resolve(v.split(/\s+/));say(r.err||exec(r.words)||'')}});
addEventListener('mousedown',e=>{e.preventDefault();cmd.focus()});
setInterval(refreshSug,400);

/* ---------- world ---------- */
const W=1000,H=700,AX=500,AY=350,RW=60;             // airport centre, runway half length (east-west)
const FIXES={maple:[110,22],cedar:[890,22],birch:[978,350],aspen:[890,678],pine:[110,678],larch:[22,350]};
const HEADINGS={north:-90,northeast:-45,east:0,southeast:45,south:90,southwest:135,west:180,northwest:-135};
const ALT={low:0,mid:1,high:2},ALTCH='LMH';
const NAMES='heron wren kite swift raven egret finch gull ibis jay lark owl puffin quail robin stork tern crane dove magpie osprey petrel snipe teal falcon grebe hawk vulture plover condor'.split(' ');
const SEP=38,CRASH=10,TURN=55*Math.PI/180,CLIMB=.22,SPEED={slow:15,normal:21,fast:28};
const rad=d=>d*Math.PI/180,wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
let S,best=+(()=>{try{return localStorage.getItem('tower-best')}catch(e){}})()||0;
function newGame(){S={t:0,planes:[],fx:[],score:0,strikes:0,next:2,over:false,paused:false,pairs:new Set(),deps:0}}
newGame();

function freshName(){const used=S.planes.map(p=>p.name.slice(0,2));
  const pool=NAMES.filter(n=>!used.includes(n.slice(0,2))&&!S.planes.some(p=>p.name===n));return pool[Math.random()*pool.length|0]||'nomad'}
function spawn(){
  const ready=S.planes.filter(p=>p.state==='ready').length;
  if(Math.random()<.38&&ready<3){const fixes=Object.keys(FIXES);
    S.planes.push({name:freshName(),kind:'dep',dest:fixes[Math.random()*6|0],state:'ready',x:AX-RW,y:AY,hdg:0,tgt:0,fix:null,alt:0,tgtAlt:0,spd:0,tgtSpd:SPEED.normal,trail:[],tt:0,age:0});return}
  for(let k=0;k<30;k++){const e=Math.random()*4|0,u=Math.random();
    const [x,y]=[[u*W,0],[W,u*H],[u*W,H],[0,u*H]][e];
    if(S.planes.some(p=>Math.hypot(p.x-x,p.y-y)<150))continue;
    const gx=AX+(Math.random()-.5)*300,gy=AY+(Math.random()-.5)*300,h=Math.atan2(gy-y,gx-x);
    S.planes.push({name:freshName(),kind:'arr',state:'fly',x,y,hdg:h,tgt:h,fix:null,alt:2,tgtAlt:2,spd:SPEED.normal,tgtSpd:SPEED.normal,trail:[],tt:0,age:0});return}}
function strike(msg,x,y){if(S.over)return;S.strikes++;say('!'+msg);S.fx.push({x,y,t:0,c:'#ff6b5e',r:40});
  if(S.strikes>=3){S.over=true;if(S.score>best){best=S.score;try{localStorage.setItem('tower-best',best)}catch(e){}}}}
function remove(p){S.planes=S.planes.filter(q=>q!==p)}

function step(dt){
  S.t+=dt;S.next-=dt;
  if(S.next<=0){spawn();S.next=Math.max(8,24-S.t/14)*(.75+Math.random()*.5)}
  for(const p of [...S.planes]){
    if(p.state==='ready')continue;
    p.age+=dt;
    if(p.state==='roll'){p.spd=Math.min(SPEED.normal,p.spd+8*dt);if(p.x>AX+RW){p.state='fly';}}
    else{
      if(p.state==='appr'){const tx=AX-p.dir*(RW+130);
        // pursue a point on the extended centreline ahead of the plane, so it captures the line smoothly
        const along=p.dir*(p.x-tx);p.tgt=along>-40?Math.atan2(AY-p.y,p.dir*60):Math.atan2(AY-p.y,tx-p.x);
        if(along>-20&&Math.abs(p.y-AY)<8&&Math.abs(wrap(p.hdg-(p.dir>0?0:Math.PI)))<.3){p.state='final';p.tgtSpd=12}}
      if(p.state==='final'){p.tgt=Math.atan2(AY-p.y,p.dir*60);p.alt=Math.max(0,p.alt);
        if(p.dir*(p.x-AX)>-RW*.2){S.score++;S.fx.push({x:p.x,y:p.y,t:0,c:'#7ee0a8',r:24});say(`${p.name} landed`);remove(p);continue}}
      if(p.fix){const[fx,fy]=FIXES[p.fix];p.tgt=Math.atan2(fy-p.y,fx-p.x)}
      if(p.state==='hold')p.hdg=wrap(p.hdg+TURN*.7*dt);
      else{const d=wrap(p.tgt-p.hdg);p.hdg=wrap(p.hdg+Math.sign(d)*Math.min(Math.abs(d),TURN*dt))}
      p.alt+=Math.sign(p.tgtAlt-p.alt)*Math.min(Math.abs(p.tgtAlt-p.alt),CLIMB*dt);
      p.spd+=Math.sign(p.tgtSpd-p.spd)*Math.min(Math.abs(p.tgtSpd-p.spd),5*dt);
    }
    p.x+=Math.cos(p.hdg)*p.spd*dt;p.y+=Math.sin(p.hdg)*p.spd*dt;
    if((p.tt-=dt)<=0){p.tt=.7;p.trail.push([p.x,p.y]);if(p.trail.length>9)p.trail.shift()}
    if(p.kind==='dep'&&p.state==='fly'){const[fx,fy]=FIXES[p.dest];
      if(Math.hypot(fx-p.x,fy-p.y)<34&&p.alt>1.9){S.score++;S.fx.push({x:p.x,y:p.y,t:0,c:'#f2c94c',r:24});say(`${p.name} handed off`);remove(p);continue}}
    if(p.x<-12||p.x>W+12||p.y<-12||p.y>H+12){remove(p);
      strike(p.kind==='dep'?`${p.name} left the wrong way`:`${p.name} lost`,Math.max(0,Math.min(W,p.x)),Math.max(0,Math.min(H,p.y)))}
  }
  // separation: same level and too close = strike once per encounter; touching = both lost
  const air=S.planes.filter(p=>p.state!=='ready'),now=new Set();
  for(let i=0;i<air.length;i++)for(let j=i+1;j<air.length;j++){const a=air[i],b=air[j];
    if(Math.abs(a.alt-b.alt)>.6)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>=SEP)continue;
    const key=[a.name,b.name].sort().join();now.add(key);a.warn=b.warn=1;
    if(d<CRASH&&!a.dead&&!b.dead){a.dead=b.dead=1;remove(a);remove(b);S.fx.push({x:a.x,y:a.y,t:0,c:'#ff6b5e',r:70});S.strikes++;strike(`${a.name} and ${b.name} collided`,a.x,a.y);continue}
    if(!S.pairs.has(key))strike(`${a.name} and ${b.name} too close`,(a.x+b.x)/2,(a.y+b.y)/2)}
  S.pairs=now;
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<1.2);
}

/* ---------- commands ---------- */
function plane(n){return S.planes.find(p=>p.name===n)}
function orders(p,words){
  let st=p.state;if(words.includes('takeoff'))st='fly';
  if(st==='ready')return['takeoff'];
  if(st==='appr'||st==='final')return['abort'];
  const o=[...Object.keys(HEADINGS),'left','right','to','hold','high','mid','low','slow','fast'];
  if(p.kind==='arr')o.push('land');return o}
function options(words){
  if(S.over)return words.length?[]:['restart'];
  if(!words.length)return[...S.planes.map(p=>p.name),'pause','restart','help'];
  const p=plane(words[0]);if(!p)return[];
  if(words[words.length-1]==='to')return Object.keys(FIXES);
  return orders(p,words.slice(1))}
function exec(words){
  const[w0,...rest]=words;
  if(w0==='restart'){newGame();return'new shift'}
  if(w0==='pause'){togglePause();return''}
  if(w0==='help')return'plane + heading (north… / left / right / to <fix>) + level (low mid high) + land / takeoff / hold / slow / fast / abort';
  const p=plane(w0);if(!rest.length)return`!${w0} what?`;const said=[];
  for(let i=0;i<rest.length;i++){const w=rest[i];
    if(w in HEADINGS){p.tgt=rad(HEADINGS[w]);p.fix=null;if(p.state==='hold')p.state='fly'}
    else if(w==='left'||w==='right'){p.tgt=wrap((p.fix||p.state==='hold'?p.hdg:p.tgt)+(w==='left'?-1:1)*rad(45));p.fix=null;if(p.state==='hold')p.state='fly'}
    else if(w==='to'){p.fix=rest[++i];if(p.state==='hold')p.state='fly';said.push('to '+p.fix);continue}
    else if(w in ALT)p.tgtAlt=ALT[w];
    else if(w==='slow'||w==='fast')p.tgtSpd=SPEED[w];
    else if(w==='hold'){if(p.state==='roll')return`!${p.name} is on the runway`;p.state='hold';p.fix=null}
    else if(w==='takeoff'){p.state='roll';p.x=AX-RW;p.y=AY;p.hdg=p.tgt=0;p.spd=0}
    else if(w==='land'){
      if(p.tgtAlt>0||p.alt>.05)return`!${p.name} must be low first`;
      if(Math.hypot(p.x-AX,p.y-AY)>290)return`!${p.name} is too far out`;
      p.dir=p.x<AX?1:-1;p.state='appr';p.fix=null;p.tgtSpd=SPEED.slow}
    else if(w==='abort'){p.state='fly';p.tgt=p.hdg;p.tgtAlt=1;p.tgtSpd=SPEED.normal}
    said.push(w)}
  return`${p.name}: ${said.join(', ')}`}
function togglePause(){if(!S.over)S.paused=!S.paused}

/* ---------- drawing ---------- */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');let sc=1,ox=0,oy=0;
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;
  sc=Math.min(r.width/W,r.height/H)*d;ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2}
addEventListener('resize',resize);resize();
const LABEL={arr:'#8fd8ff',dep:'#f2c94c'};
function draw(){
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#06110c';cx.fillRect(0,0,cv.width,cv.height);
  cx.setTransform(sc,0,0,sc,ox,oy);
  cx.fillStyle='#081a11';cx.fillRect(0,0,W,H);
  cx.strokeStyle='#123224';cx.lineWidth=1;
  for(const r of[110,220,330,440]){cx.beginPath();cx.arc(AX,AY,r,0,7);cx.stroke()}
  // sweep
  const a=S.t*1.1;const g=cx.createRadialGradient(AX,AY,0,AX,AY,620);g.addColorStop(0,'rgba(126,224,168,.12)');g.addColorStop(1,'rgba(126,224,168,0)');
  cx.fillStyle=g;cx.beginPath();cx.moveTo(AX,AY);cx.arc(AX,AY,640,a-.5,a);cx.closePath();cx.fill();
  // land zone, runway, centreline
  cx.setLineDash([3,7]);cx.strokeStyle='#1d4a33';cx.beginPath();cx.arc(AX,AY,290,0,7);cx.stroke();
  cx.beginPath();cx.moveTo(AX-RW-190,AY);cx.lineTo(AX+RW+190,AY);cx.stroke();cx.setLineDash([]);
  cx.fillStyle='#3a5a48';cx.fillRect(AX-RW,AY-4,RW*2,8);
  cx.font='13px ui-monospace,Menlo,monospace';cx.textBaseline='middle';
  for(const[n,[x,y]]of Object.entries(FIXES)){cx.fillStyle='#4f7d63';cx.beginPath();cx.moveTo(x,y-7);cx.lineTo(x+7,y+5);cx.lineTo(x-7,y+5);cx.fill();
    cx.textAlign=x<100?'left':x>900?'right':'center';cx.fillText(n,x+(x<100?12:x>900?-12:0),y+(y<100?20:y>600?-18:0))}
  const focus=typedHead();
  for(const p of S.planes){if(p.state==='ready')continue;
    const lvl=Math.round(p.alt),col=p.warn?'#ff6b5e':LABEL[p.kind];
    p.trail.forEach(([x,y],i)=>{cx.fillStyle=`rgba(211,234,217,${.05+i*.04})`;cx.fillRect(x-1.5,y-1.5,3,3)});
    if(p.warn){cx.strokeStyle='rgba(255,107,94,.5)';cx.beginPath();cx.arc(p.x,p.y,SEP/2,0,7);cx.stroke()}
    if(p.name===focus){cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,12+Math.sin(S.t*6)*1.5,0,7);cx.stroke();cx.lineWidth=1;
      if(p.fix){cx.setLineDash([2,5]);cx.strokeStyle='rgba(255,255,255,.35)';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(...FIXES[p.fix]);cx.stroke();cx.setLineDash([])}}
    const s=4+lvl*1.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.hdg);cx.fillStyle=col;
    cx.beginPath();cx.moveTo(s+3,0);cx.lineTo(-s,-s);cx.lineTo(-s*.4,0);cx.lineTo(-s,s);cx.closePath();cx.fill();cx.restore();
    const arrow=p.tgtAlt>p.alt+.01?'↑':p.tgtAlt<p.alt-.01?'↓':'';
    const tag=p.state==='hold'?' ⟳':p.state==='appr'||p.state==='final'?' ▾':'';
    cx.textAlign='left';cx.fillStyle=p.name===focus?'#fff':col;
    cx.fillText(`${p.name} ${ALTCH[lvl]}${arrow}${tag}${p.kind==='dep'?' → '+p.dest:''}`,p.x+11,p.y-11);
    p.warn=0}
  for(const f of S.fx){cx.strokeStyle=f.c;cx.globalAlpha=1-f.t/1.2;cx.lineWidth=2;cx.beginPath();cx.arc(f.x,f.y,6+f.r*f.t,0,7);cx.stroke();cx.globalAlpha=1;cx.lineWidth=1}
}
const over=document.getElementById('over');
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!S.paused&&!S.over)step(dt);draw();
  const focus=typedHead();document.getElementById('ready').innerHTML=S.planes.filter(p=>p.state==='ready').map(p=>`<b style="color:${p.name===focus?'#fff':LABEL.dep}">${p.name} → ${p.dest}</b>`).join(' ')||'';
  document.getElementById('score').textContent=S.score;document.getElementById('best').textContent=best;
  document.getElementById('strikes').textContent='●'.repeat(S.strikes)+'○'.repeat(Math.max(0,3-S.strikes));
  over.style.display=S.over||S.paused?'grid':'none';
  over.innerHTML=S.over?`shift over<br><b>${S.score}</b><br><small>restart</small>`:'paused<br><small>esc</small>';
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
if(location.hash==='#dev')window.G={get S(){return S},step,exec,options,resolve};
</script></body></html>
